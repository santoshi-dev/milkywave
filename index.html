
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MilkyWave 🌌</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
font-family:'Orbitron',sans-serif;
background:black;
color:white;
height:100vh;
}

#bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-10;
}

/* =========================
   TITLE
========================= */

.hero{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:10;
pointer-events:none;
}

.hero h1{
font-size:72px;
letter-spacing:8px;
font-weight:900;
background:linear-gradient(90deg,
#00eaff,
#ff00ff,
#ffffff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:
0 0 30px rgba(0,255,255,0.3);
}

.hero p{
margin-top:18px;
font-size:14px;
letter-spacing:3px;
opacity:0.75;
}

/* =========================
   MUSIC PANEL
========================= */

.music-panel{
position:fixed;
right:40px;
top:50%;
transform:translateY(-50%);
width:320px;
padding:25px;
background:rgba(10,10,30,0.55);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,0.1);
border-radius:30px;
box-shadow:
0 0 40px rgba(0,255,255,0.15),
0 0 80px rgba(255,0,255,0.08);
opacity:0;
pointer-events:none;
transition:0.5s;
z-index:20;
}

.music-panel.active{
opacity:1;
pointer-events:auto;
right:60px;
}

.album-art{
width:120px;
height:120px;
border-radius:50%;
margin:auto;
background:
radial-gradient(circle,
#ff00ff,
#00eaff);
box-shadow:
0 0 40px #00eaff,
0 0 80px #ff00ff;
animation:spin 8s linear infinite;
}

@keyframes spin{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

.song-title{
margin-top:22px;
font-size:26px;
text-align:center;
font-weight:bold;
}

.artist-name{
margin-top:10px;
text-align:center;
opacity:0.7;
font-size:14px;
letter-spacing:2px;
}

.description{
margin-top:15px;
text-align:center;
font-size:13px;
line-height:1.7;
opacity:0.8;
}

.equalizer{
display:flex;
justify-content:center;
align-items:flex-end;
gap:8px;
height:50px;
margin-top:25px;
}

.bar{
width:8px;
background:cyan;
border-radius:10px;
animation:bounce 1s infinite alternate;
}

.bar:nth-child(2){animation-delay:0.2s;}
.bar:nth-child(3){animation-delay:0.4s;}
.bar:nth-child(4){animation-delay:0.6s;}

@keyframes bounce{
from{height:10px;}
to{height:45px;}
}

/* =========================
   MOBILE
========================= */

@media(max-width:768px){

.hero h1{
font-size:42px;
letter-spacing:4px;
}

.hero p{
font-size:11px;
}

.music-panel{
width:90%;
right:5%;
top:auto;
bottom:20px;
transform:none;
}

.music-panel.active{
right:5%;
}

}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="hero">
<h1>MILKYWAVE</h1>
<p>TRAVEL THE GALAXY THROUGH MUSIC 🎧</p>
</div>

<div class="music-panel" id="musicPanel">

<div class="album-art"></div>

<div class="song-title" id="songTitle">
Select A Planet
</div>

<div class="artist-name" id="artistName">
Music Universe
</div>

<div class="description" id="description">
Enter different musical galaxies floating across the cosmic void.
</div>

<div class="equalizer">
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
<div class="bar"></div>
</div>

</div>

<script>

/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(
0x070816,
0.0018
);

/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
3000
);

camera.position.set(0,30,120);

/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
canvas:document.querySelector('#bg'),
antialias:true,
alpha:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

/* =========================
   LIGHTS
========================= */

const ambientLight =
new THREE.AmbientLight(0xffffff,0.35);

scene.add(ambientLight);

const pinkLight =
new THREE.PointLight(0xff00ff,2,800);

pinkLight.position.set(120,80,100);

scene.add(pinkLight);

const cyanLight =
new THREE.PointLight(0x00eaff,2,800);

cyanLight.position.set(-120,-80,50);

scene.add(cyanLight);

/* =========================
   STARFIELD
========================= */

const starsGeometry =
new THREE.BufferGeometry();

const starCount = 4000;

const starPositions =
new Float32Array(starCount*3);

for(let i=0;i<starCount*3;i++){

starPositions[i] =
(Math.random()-0.5)*3000;

}

starsGeometry.setAttribute(
'position',
new THREE.BufferAttribute(
starPositions,
3
)
);

const starsMaterial =
new THREE.PointsMaterial({
color:0xffffff,
size:1,
transparent:true,
opacity:0.8
});

const stars =
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* =========================
   COSMIC DUST
========================= */

const dustGeometry =
new THREE.BufferGeometry();

const dustCount = 5000;

const dustPositions =
new Float32Array(dustCount*3);

for(let i=0;i<dustCount*3;i++){

 dustPositions[i] =
 (Math.random()-0.5)*3500;

}

 dustGeometry.setAttribute(
 'position',
 new THREE.BufferAttribute(
 dustPositions,
 3
 )
);

const dustMaterial =
new THREE.PointsMaterial({
color:0x8888ff,
size:0.7,
transparent:true,
opacity:0.12
});

const dust =
new THREE.Points(
dustGeometry,
dustMaterial
);

scene.add(dust);

/* =========================
   GALAXY CORE
========================= */

const coreGeometry =
new THREE.SphereGeometry(12,64,64);

const coreMaterial =
new THREE.MeshStandardMaterial({
color:0xaa00ff,
emissive:0x5500ff,
emissiveIntensity:2
});

const core =
new THREE.Mesh(coreGeometry,coreMaterial);

scene.add(core);

/* =========================
   PLANETS
========================= */

const planets=[];

const planetData=[
{
name:'Neon Earth',
artist:'English Pop',
description:'Neon cities floating through cosmic soundwaves.',
color:0x00ffcc,
distance:35,
size:4,
speed:0.6
},
{
name:'Sakura Moon',
artist:'Japanese Dreams',
description:'Anime skies and celestial memories drifting forever.',
color:0xff66cc,
distance:50,
size:3.5,
speed:0.4
},
{
name:'Golden Venus',
artist:'Bollywood Universe',
description:'Golden emotions wrapped in interstellar warmth.',
color:0xffcc33,
distance:65,
size:5,
speed:0.3
},
{
name:'Cyber Saturn',
artist:'EDM Galaxy',
description:'Electric rave energy inside cosmic rings.',
color:0x00aaff,
distance:80,
size:4.5,
speed:0.2
}
];

planetData.forEach((data,index)=>{

const geometry =
new THREE.SphereGeometry(
data.size,
64,
64
);

const material =
new THREE.MeshStandardMaterial({
color:data.color,
emissive:data.color,
emissiveIntensity:0.5,
roughness:0.4,
metalness:0.3
});

const planet =
new THREE.Mesh(
geometry,
material
);

planet.userData = data;

scene.add(planet);

/* GLOW */

const glowGeometry =
new THREE.SphereGeometry(
data.size*1.3,
64,
64
);

const glowMaterial =
new THREE.MeshBasicMaterial({
color:data.color,
transparent:true,
opacity:0.15,
side:THREE.BackSide
});

const glow =
new THREE.Mesh(
glowGeometry,
glowMaterial
);

planet.add(glow);

/* SATURN RING */

if(index===3){

const ringGeometry =
new THREE.TorusGeometry(
8,
1,
16,
100
);

const ringMaterial =
new THREE.MeshBasicMaterial({
color:0x00eaff,
transparent:true,
opacity:0.4
});

const ring =
new THREE.Mesh(
ringGeometry,
ringMaterial
);

ring.rotation.x = Math.PI/2.5;

planet.add(ring);

}

planets.push(planet);

});

/* =========================
   METEORS
========================= */

function createMeteor(){

const meteorGeometry =
new THREE.SphereGeometry(0.4,8,8);

const meteorMaterial =
new THREE.MeshBasicMaterial({
color:0xffffff
});

const meteor =
new THREE.Mesh(
meteorGeometry,
meteorMaterial
);

meteor.position.set(
300,
Math.random()*200,
-200
);

scene.add(meteor);

const speed = 8 + Math.random()*8;

function animateMeteor(){

meteor.position.x -= speed;
meteor.position.y -= speed;

if(meteor.position.x < -400){
scene.remove(meteor);
return;
}

requestAnimationFrame(animateMeteor);
}

animateMeteor();
}

setInterval(createMeteor,2500);

/* =========================
   INTERACTION
========================= */

const raycaster =
new THREE.Raycaster();

const mouse =
new THREE.Vector2();

window.addEventListener('click',(event)=>{

mouse.x =
(event.clientX/window.innerWidth)*2-1;

mouse.y =
-(event.clientY/window.innerHeight)*2+1;

raycaster.setFromCamera(mouse,camera);

const intersects =
raycaster.intersectObjects(planets);

if(intersects.length>0){

const data =
intersects[0].object.userData;

const panel =
document.getElementById('musicPanel');

panel.classList.add('active');

document.getElementById('songTitle').innerHTML = data.name;

document.getElementById('artistName').innerHTML = data.artist;

document.getElementById('description').innerHTML = data.description;

}

});

/* =========================
   CAMERA DRIFT
========================= */

let mouseX=0;
let mouseY=0;

window.addEventListener('mousemove',(e)=>{

mouseX =
(e.clientX/window.innerWidth -0.5)*10;

mouseY =
(e.clientY/window.innerHeight -0.5)*10;

});

/* =========================
   ANIMATION
========================= */

function animate(){

requestAnimationFrame(animate);

const time = Date.now()*0.0002;

/* CORE */

core.rotation.y += 0.002;

/* PLANETS */

planets.forEach((planet,index)=>{

const data = planet.userData;

const angle =
time*data.speed + index;

planet.position.x =
Math.cos(angle)*data.distance;

planet.position.z =
Math.sin(angle)*data.distance;

planet.position.y =
Math.sin(time+index)*8;

planet.rotation.y += 0.01;

});

/* ATMOSPHERE */

dust.rotation.y += 0.00008;

stars.rotation.y += 0.00003;

/* CAMERA */

camera.position.x +=
(mouseX-camera.position.x)*0.02;

camera.position.y +=
(-mouseY-camera.position.y)*0.02;

camera.lookAt(0,0,0);

renderer.render(scene,camera);

}

animate();

/* =========================
   RESIZE
========================= */

window.addEventListener('resize',()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

</script>

</body>
</html>
